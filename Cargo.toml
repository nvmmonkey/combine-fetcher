[package]
name = "combine-fetcher"
version = "0.1.0"
edition = "2021"
description = "Data fetcher for combining Binance and Polymarket data"

[lib]
name = "combine_fetcher"
path = "src/lib.rs"

[[bin]]
name = "data_logger"
path = "src/main.rs"

[[bin]]
name = "multi_market_logger"
path = "src/bin/multi_market_logger.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[[bin]]
name = "multi_asset_logger"
path = "src/bin/multi_asset_logger.rs"

[[bin]]
name = "debug_resolution"
path = "src/bin/debug_resolution.rs"

[[bin]]
name = "multi_market_logger_hourly_fixed"
path = "src/bin/multi_market_logger_hourly_fixed.rs"

[[bin]]
name = "multi_asset_logger_fixed"
path = "src/bin/multi_asset_logger_fixed.rs"

[[bin]]
name = "hourly_asset_logger"
path = "src/bin/hourly_asset_logger.rs"

[[bin]]
name = "multi_asset_logger_fixed_rotation"
path = "src/bin/multi_asset_logger_fixed_rotation.rs"

[[bin]]
name = "multi_asset_logger_fixed_rotation_sbe"
path = "src/bin/multi_asset_logger_fixed_rotation_sbe.rs"

[[bin]]
name = "multi_asset_logger_fixed_rotation_sbe_obi"
path = "src/bin/multi_asset_logger_fixed_rotation_sbe_obi.rs"

[[bin]]
name = "signal_engine"
path = "src/bin/signal_engine.rs"

# [[bin]]
# name = "test_binance_bootstrap"
# path = "src/bin/test_binance_bootstrap.rs"

[dependencies]
# Polymarket SDK (local vendor path)
polymarket-client-sdk = { version = "0.4.1", features = ["clob", "ws", "rtds"] }
# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
futures = "0.3"
# Concurrent data structures
dashmap = "6.1"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1.40.0"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Shared memory signal output
signal-shm = { path = "signal-shm" }

# dashboard
ratatui   = "0.29"
crossterm = "0.28"

[features]
default = []

[patch.crates-io]
polymarket-client-sdk = { path = "polymarket-client-sdk-patched" }

[profile.release]
opt-level = 3
lto = true
