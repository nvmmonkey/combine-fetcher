[package]
name = "combine-fetcher"
version = "0.1.0"
edition = "2021"
description = "Data fetcher for combining Binance and Polymarket data"

[lib]
name = "combine_fetcher"
path = "src/lib.rs"

[[bin]]
name = "data_logger"
path = "src/main.rs"

[[bin]]
name = "multi_market_logger"
path = "src/bin/multi_market_logger.rs"

# [[bin]]
# name = "test_binance_bootstrap"
# path = "src/bin/test_binance_bootstrap.rs"

[dependencies]
# Polymarket SDK (local vendor path)
polymarket-client-sdk = { version = "0.4.1", features = ["clob", "ws", "rtds"] }
# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
futures = "0.3"
# Concurrent data structures
dashmap = "6.1"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1.40.0"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
